<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mr. Claude, On Demand</title>
<meta name="description" content="Your face, your voice, your lessons. Finished videos without ever filming again.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one calm column on a bone-white page; the hero is a quiet statement beside a phone frame "playing" his lesson. */
:root{
  --bg:#fbfaf7; --paper:#ffffff; --ink:#0f1214; --muted:#5f666b; --line:#e6e3dc; --accent:#0e6b5c; --soft:#eef4f1; --dark:#0f1214; --onDark:#f5f3ee;
  --serif:"Instrument Serif",Georgia,serif; --sans:"Inter Tight",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0f10;--paper:#151819;--ink:#f2f0eb;--muted:#9aa2a6;--line:#262b2d;--accent:#5cc7b1;--soft:#14201d;--dark:#f2f0eb;--onDark:#0d0f10;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d0f10;--paper:#151819;--ink:#f2f0eb;--muted:#9aa2a6;--line:#262b2d;--accent:#5cc7b1;--soft:#14201d;--dark:#f2f0eb;--onDark:#0d0f10;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 var(--sans);-webkit-font-smoothing:antialiased;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
main{max-width:1040px;margin:0 auto}
h1,h2,h3{font-family:var(--serif);font-weight:400;line-height:1.04;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(2.8rem,8vw,5.4rem)}
h2{font-size:clamp(2rem,5vw,3.2rem)}
h3{font-size:1.6rem}
p{margin:0}
em{font-style:italic;color:var(--accent)}
.eyebrow{font:500 .72rem var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
section{padding-block:72px;border-top:1px solid var(--line);display:grid;gap:28px}
nav{display:flex;justify-content:space-between;align-items:center;padding-block:20px}
nav b{font-family:var(--serif);font-size:1.4rem;font-weight:400}
.btn{display:inline-flex;align-items:center;gap:10px;background:var(--dark);color:var(--onDark);font:600 1rem var(--sans);padding:15px 22px;border-radius:999px;text-decoration:none;border:0;cursor:pointer;transition:transform .2s}
.btn:hover{transform:translateY(-2px)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.hero{display:grid;grid-template-columns:1.25fr .75fr;gap:48px;align-items:center;padding-block:40px 80px;border:0}
.hero .lead{font-size:1.25rem;color:var(--muted);max-width:34ch}
.ctas{display:flex;flex-wrap:wrap;gap:12px}
.phone{justify-self:center;width:min(280px,100%);aspect-ratio:9/19;border-radius:38px;background:#0b0d0e;padding:10px;box-shadow:0 30px 80px -30px rgba(15,18,20,.45),0 0 0 1px var(--line)}
.screen{position:relative;height:100%;border-radius:30px;overflow:hidden;background:radial-gradient(120% 80% at 50% 25%,#2c3b37 0%,#121817 60%,#0b0d0e 100%)}
.face{position:absolute;left:50%;top:20%;transform:translateX(-50%);width:46%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 50% 38%,#d9c3a9 0 34%,transparent 35%),radial-gradient(ellipse at 50% 100%,#2f4a44 0 55%,transparent 56%);opacity:.95}
.print{position:absolute;left:50%;bottom:30%;transform:translateX(-50%);width:62%;aspect-ratio:1;border-radius:50%;background:repeating-radial-gradient(ellipse at 50% 60%,transparent 0 5px,rgba(120,220,195,.55) 5px 6.5px);mask:radial-gradient(ellipse 48% 56% at 50% 55%,#000 60%,transparent 62%);-webkit-mask:radial-gradient(ellipse 48% 56% at 50% 55%,#000 60%,transparent 62%);animation:scan 4s ease-in-out infinite}
@keyframes scan{50%{opacity:.4}}
.cap{position:absolute;left:8%;right:8%;bottom:14%;text-align:center;font:800 1.05rem/1.2 var(--sans);color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.cap b{color:#7ee2c9}
.rec{position:absolute;top:16px;left:16px;font:500 .62rem var(--mono);color:#fff;letter-spacing:.1em;display:flex;align-items:center;gap:6px}
.rec::before{content:"";width:7px;height:7px;border-radius:50%;background:#e5484d}
.bar{position:absolute;left:12px;right:12px;bottom:8px;height:3px;background:rgba(255,255,255,.2);border-radius:3px;overflow:hidden}
.bar::after{content:"";display:block;height:100%;width:62%;background:#fff}
@media (prefers-reduced-motion:reduce){.print{animation:none}.btn{transition:none}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.stat b{display:block;font-family:var(--serif);font-size:clamp(2.4rem,6vw,3.6rem);font-weight:400;line-height:1}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.col{border:1px solid var(--line);border-radius:18px;padding:26px;display:grid;gap:14px;align-content:start;background:var(--paper)}
.col.win{background:var(--soft);border-color:transparent}
.col ul{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.col li{display:grid;grid-template-columns:1.4rem 1fr;gap:8px}
.col li::before{content:"–";color:var(--muted)}
.col.win li::before{content:"✓";color:var(--accent);font-weight:700}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.step{display:grid;gap:8px;align-content:start}
.step .n{font:500 .8rem var(--mono);color:var(--accent)}
.script{display:grid;gap:12px;max-width:62ch}
.script p{font-family:var(--serif);font-size:1.45rem;line-height:1.3}
.script span{font:500 .72rem var(--mono);color:var(--muted);display:block;margin-bottom:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:24px;display:grid;gap:12px;align-content:start;min-width:0}
.card ul{margin:0;padding-left:1.1em;display:grid;gap:6px}
.read{font-family:var(--serif);font-size:1.25rem;line-height:1.35;background:var(--soft);border-radius:12px;padding:16px}
.promise{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
form{display:grid;gap:14px;max-width:620px}
label{display:grid;gap:6px;font-weight:600;font-size:.95rem}
input,textarea,select{font:inherit;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);width:100%}
textarea{min-height:100px}
.final{background:var(--dark);color:var(--onDark);border-radius:28px;padding:56px clamp(22px,5vw,64px);display:grid;gap:22px;border:0;margin-block:40px 72px}
.final .btn{background:var(--onDark);color:var(--dark)}
.final .muted{color:inherit;opacity:.7}
footer{padding-block:28px 48px;color:var(--muted);font-size:.85rem;border-top:1px solid var(--line)}
@media (max-width:820px){.hero,.compare,.grid2,.promise{grid-template-columns:1fr}.steps{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr}.hero{gap:36px}}
</style>
</head><body><main><section style="border:0;padding-block:120px"><span class="eyebrow">Received</span><h1>Thank you. <em>We're on it.</em></h1><p class="muted" style="font-size:1.2rem">Your recording links and a draft script are on their way.</p><div><a class="btn" href="/">Back</a></div></section></main></body></html>
